services:
  postgres:
    image: postgres:16-alpine
    container_name: sih-criminal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih_dev_password
      POSTGRES_DB: sih_criminal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
